<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Glove Tuner</title>
<style>html,body{margin:0;height:100%;background:#9aa0a8;overflow:hidden;font-family:system-ui}#c{display:block;width:100%;height:100%}#hint{position:fixed;top:8px;left:8px;color:#fff;font-size:12px;opacity:.7}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.js"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to rotate · pinch to zoom · sliders top-right · "Copy params" logs values</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';
import { buildHand, DEFAULT_P } from '../src/glovebuild.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa0a8);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(0.4, 0.9, 0.8); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.45); fill.position.set(-0.7, 0.1, 0.5); scene.add(fill);

const cam = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
cam.position.set(0, 0.04, 0.55);
const controls = new OrbitControls(cam, canvas);
controls.target.set(0, 0.02, 0);

const P = { ...DEFAULT_P, showBoth: false };
let group = new THREE.Group(); scene.add(group);
function rebuild() {
  scene.remove(group); group = new THREE.Group(); scene.add(group);
  if (P.showBoth) {
    const L = buildHand(P, -1); L.position.x = -0.16; group.add(L);
    const R = buildHand(P, 1); R.position.x = 0.16; group.add(R);
  } else {
    group.add(buildHand(P, 1));
  }
}
rebuild();

const gui = new GUI();
const add = (k, a, b, s) => gui.add(P, k, a, b, s).onChange(rebuild);
add('fingerCount', 2, 5, 1);
add('fingerLen', 0.06, 0.18, 0.001); add('fingerRad', 0.02, 0.045, 0.001);
add('fingerSpread', 0.035, 0.07, 0.001); add('fingerFan', 0, 0.3, 0.01); add('fingerTilt', -0.4, 0.2, 0.01);
add('palmW', 0.1, 0.18, 0.001); add('palmH', 0.09, 0.16, 0.001); add('palmD', 0.05, 0.1, 0.001); add('palmR', 0.015, 0.05, 0.001);
add('knuckleRad', 0.02, 0.05, 0.001);
add('thumbLen', 0.04, 0.12, 0.001); add('thumbRad', 0.022, 0.05, 0.001); add('thumbAngle', 0.4, 1.4, 0.01); add('thumbX', 0.0, 0.08, 0.001); add('thumbY', -0.05, 0.05, 0.001);
add('cuffR', 0.04, 0.09, 0.001); add('cuffTube', 0.008, 0.03, 0.001);
add('dartLen', 0.03, 0.09, 0.001); add('dartRad', 0.004, 0.012, 0.0005); add('dartSpread', 0.015, 0.045, 0.001); add('dartY', -0.02, 0.04, 0.001); add('dartFan', 0, 0.4, 0.01);
gui.add(P, 'showBoth').onChange(rebuild);
gui.add({ copy: () => {
  const out = {}; for (const k of Object.keys(DEFAULT_P)) out[k] = P[k];
  const s = JSON.stringify(out, null, 2);
  console.log(s); navigator.clipboard && navigator.clipboard.writeText(s);
  alert('Params copied to clipboard / console:\n\n' + s);
} }, 'copy').name('Copy params');

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, cam); });
</script>
</body>
</html>
