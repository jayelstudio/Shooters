<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#9aa0a8;overflow:hidden}#c{display:block;margin:0 auto}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { environment } from '../src/materials.js';

const params = new URLSearchParams(location.search);
const ry = parseFloat(params.get('ry') ?? '0');
const rx = parseFloat(params.get('rx') ?? '0');
const W = 600, H = 600;
const canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa0a8);
scene.environment = environment(renderer);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(0.4, 0.9, 0.8); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.45); fill.position.set(-0.7, 0.1, 0.5); scene.add(fill);
const cam = new THREE.PerspectiveCamera(40, 1, 0.01, 100); cam.position.set(0, 0, 0.6); cam.lookAt(0, 0, 0);

const mode = params.get('mode') || 'toon'; // 'raw' | 'toon'
const seamScale = parseFloat(params.get('seamScale') ?? '1');

const ramp = new Uint8Array([195, 230, 255]);
const grad = new THREE.DataTexture(ramp, ramp.length, 1, THREE.RedFormat);
grad.needsUpdate = true; grad.minFilter = grad.magFilter = THREE.NearestFilter;

const mtl = await new MTLLoader().loadAsync('../Basket Ball.mtl');
mtl.preload();
const loader = new OBJLoader(); loader.setMaterials(mtl);
const obj = await loader.loadAsync('../buckets-ball.obj');
const names = [];
const toToon = (m) => {
  const col = (m && m.color) ? m.color.clone() : new THREE.Color(0xd4641d);
  const lum = col.r * 0.299 + col.g * 0.587 + col.b * 0.114;
  const body = lum > 0.05;
  if (body) col.multiplyScalar(1.35); // brighten the orange
  return new THREE.MeshToonMaterial({
    color: col, gradientMap: grad,
    emissive: body ? col.clone() : new THREE.Color(0),
    emissiveIntensity: body ? 0.3 : 0,
  });
};
obj.traverse((o) => {
  if (!o.isMesh) return;
  names.push(Array.isArray(o.material) ? o.material.map((m) => m.name).join(',') : (o.material && o.material.name));
  if (mode === 'toon') {
    o.material = Array.isArray(o.material) ? o.material.map(toToon) : toToon(o.material);
  }
});
window.__names = names;

const box = new THREE.Box3().setFromObject(obj);
const size = new THREE.Vector3(); box.getSize(size);
const center = new THREE.Vector3(); box.getCenter(center);
const wrap = new THREE.Group(); wrap.add(obj);
obj.position.sub(center);
wrap.scale.setScalar(0.24 / Math.max(size.x, size.y, size.z));
wrap.rotation.set(rx * Math.PI / 180, ry * Math.PI / 180, 0);
scene.add(wrap);

renderer.render(scene, cam);
requestAnimationFrame(() => { renderer.render(scene, cam); window.__ready = true; });
</script>
</body>
</html>
