<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#9aa0a8;overflow:hidden}#c{display:block;margin:0 auto}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

const params = new URLSearchParams(location.search);
const view = params.get('view') || 'pov';
const W = view === 'pov' ? 560 : 700, H = view === 'pov' ? 980 : 700;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9aa0a8);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(0.4, 0.9, 0.8); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.45); fill.position.set(-0.7, 0.1, 0.5); scene.add(fill);

const gloveMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.82, metalness: 0 });
const dartMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
const holeMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide });

function teardrop(mat) {
  const g = new THREE.Group(); const r = 0.0075;
  g.add(new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), mat));
  const cone = new THREE.Mesh(new THREE.ConeGeometry(r, r * 4.2, 14), mat);
  cone.position.y = r * 2.3; g.add(cone); g.scale.set(1, 1, 0.35); return g;
}

function buildHand(side) {
  const mc = new MarchingCubes(80, gloveMat, true, false, 120000);
  mc.isolation = 80; mc.reset();
  const add = (x, y, z, s) => mc.addBall(x, y, z, s, 12);
  add(0.5, 0.40, 0.5, 0.55); add(0.42, 0.40, 0.5, 0.45); add(0.58, 0.40, 0.5, 0.45);
  add(0.5, 0.45, 0.5, 0.45); add(0.46, 0.44, 0.5, 0.34); add(0.54, 0.44, 0.5, 0.34);
  const fx = [0.38, 0.5, 0.62]; const fy = [0.50, 0.555, 0.61, 0.665, 0.715]; const fs = [0.15, 0.14, 0.13, 0.11, 0.09];
  fx.forEach((x) => fy.forEach((y, i) => add(x, y, 0.5, fs[i])));
  add(0.5 - side * 0.12, 0.40, 0.53, 0.2); add(0.5 - side * 0.165, 0.44, 0.55, 0.16); add(0.5 - side * 0.20, 0.485, 0.57, 0.12);
  mc.update();
  const geo = mc.geometry; geo.computeBoundingBox();
  const bb = geo.boundingBox; const size = new THREE.Vector3(); bb.getSize(size);
  const center = new THREE.Vector3(); bb.getCenter(center);
  const s = 0.3 / Math.max(size.x, size.y, size.z); const sx = s * 0.765, sz = s * 0.765;
  mc.position.set(-center.x, -center.y, -center.z); mc.castShadow = true;
  const inner = new THREE.Group(); inner.add(mc); inner.scale.set(sx, s, sz);
  const hand = new THREE.Group(); hand.add(inner);
  const Wd = size.x * sx, Hh = size.y * s;
  const cuffR = Wd * 0.34, tube = Wd * 0.13, bottomY = -Hh / 2;
  const cuff = new THREE.Mesh(new THREE.TorusGeometry(cuffR, tube, 14, 28), gloveMat);
  cuff.position.set(0, bottomY + tube * 0.5, 0); cuff.rotation.x = Math.PI / 2 - 0.2; hand.add(cuff);
  const hole = new THREE.Mesh(new THREE.CircleGeometry(cuffR * 0.8, 22), holeMat);
  hole.position.set(0, bottomY + tube * 0.2, 0.004); hole.rotation.x = Math.PI / 2 - 0.2; hand.add(hole);
  hand.updateMatrixWorld(true);
  const ray = new THREE.Raycaster();
  const spots = [[-0.028, 0.03], [0, 0.045], [0.028, 0.03]]; const fan = [0.22, 0, -0.22];
  spots.forEach(([dxv, dyv], i) => {
    ray.set(new THREE.Vector3(dxv, dyv, 0.6), new THREE.Vector3(0, 0, -1));
    const hit = ray.intersectObject(mc, false)[0]; if (!hit) return;
    const n = hit.face.normal.clone().transformDirection(mc.matrixWorld).normalize();
    const d = teardrop(dartMat);
    d.position.copy(hit.point).addScaledVector(n, 0.002);
    d.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n); d.rotateZ(fan[i]); hand.add(d);
  });
  return hand;
}

let cam;
if (view === 'pov') {
  cam = new THREE.PerspectiveCamera(74, W / H, 0.1, 100);
  cam.position.set(0, 0, 0); cam.lookAt(0, 0, -1);
  // ball
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 24),
    new THREE.MeshStandardMaterial({ color: 0xd4641d, roughness: 0.6 }));
  ball.position.set(0, -0.38, -0.71); scene.add(ball);
  // hands per _applyArmPose at rest (p=0, ft=0)
  const by = -0.38, bz = -0.71, tiltOver = -0.35;
  const left = buildHand(-1); left.scale.setScalar(0.8);
  left.position.set(-0.12, by - 0.02, bz + 0.05); left.rotation.set(tiltOver, -1.15, -0.08); scene.add(left);
  const right = buildHand(1); right.scale.setScalar(0.8);
  right.position.set(0.045, by - 0.03, bz + 0.155); right.rotation.set(tiltOver + 0.22, 0.4, 0.05); scene.add(right);
} else {
  cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  cam.position.set(0, 0.02, 0.95); cam.lookAt(0, 0, 0);
  const hand = buildHand(1); hand.scale.setScalar(0.8);
  hand.rotation.set(view === 'grip' ? -0.13 : -0.1, view === 'grip' ? 0.4 : -0.3, 0.05); scene.add(hand);
}

renderer.render(scene, cam);
requestAnimationFrame(() => { renderer.render(scene, cam); window.__ready = true; });
</script>
</body>
</html>
