<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05060a" />
  <title>Buckets — 3PT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- HUD (split to the top corners so the ball's arc stays clear) -->
  <div class="hud-side hud-left">
    <div class="hud-cell"><span class="hud-label">LEVEL</span><span id="hud-level">1</span></div>
    <div class="hud-cell"><span class="hud-label">SCORE</span><span id="hud-score">0</span></div>
  </div>
  <div class="hud-side hud-right">
    <div class="hud-cell"><span class="hud-label">MAKES</span><span id="hud-makes">0/3</span></div>
    <div class="hud-cell"><span class="hud-label">LIVES</span><span id="hud-lives">5</span></div>
  </div>

  <div id="dir-arrow" class="hidden"></div>
  <div id="shoot-cue" class="hidden">SHOOT!</div>
  <div id="banner"></div>
  <div id="popup"></div>

  <!-- Power meter -->
  <div id="meter">
    <div id="meter-zone"></div>
    <div id="meter-fill"></div>
    <div id="meter-indicator"></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button id="btn-left" class="ctl move" aria-label="Move left"><img src="./arrow-left.svg" alt="Left" /></button>
    <button id="btn-right" class="ctl move" aria-label="Move right"><img src="./arrow-right.svg" alt="Right" /></button>
    <button id="btn-timeout" class="ctl big timeout" aria-label="Timeout / pause">
      <img src="./timeout-btn.svg" alt="Timeout" />
    </button>
    <button id="btn-shoot" class="ctl big shoot" aria-label="Shoot">
      <img src="./bball.png" alt="Shoot" />
    </button>
  </div>

  <!-- Overlays -->
  <div id="overlay-start" class="overlay splash" role="button" tabindex="0" aria-label="Tap to play">
    <img class="splash-img" src="./buckets-splash.png" alt="Buckets — Tap to play" />
  </div>

  <div id="overlay-pause" class="overlay hidden">
    <div class="panel pause-panel">
      <h2 class="pause-title">TIME OUT</h2>
      <button id="btn-continue" class="img-btn" aria-label="Continue">
        <img src="./continue-btn.svg" alt="Continue" />
      </button>
      <button id="btn-endgame" class="img-btn" aria-label="End game">
        <img src="./end-game-btn.svg" alt="End game" />
      </button>
    </div>
  </div>

  <div id="overlay-over" class="overlay hidden">
    <div class="panel">
      <h1>GAME OVER</h1>
      <p id="final-score" class="sub"></p>
      <button id="btn-restart" class="primary">PLAY AGAIN</button>
    </div>
  </div>

  <div id="rotate" class="overlay hidden">
    <div class="panel">
      <h1>↻</h1>
      <p class="sub">Rotate your device to portrait</p>
    </div>
  </div>

  <div id="loaderr" class="overlay hidden">
    <div class="panel">
      <h1>Couldn't load 3D engine</h1>
      <p class="sub">This game needs an internet connection the first time to fetch the Three.js library, and must be served over http(s) (not opened as a file://).</p>
    </div>
  </div>

  <script>
    // Surface module load failures (e.g., offline CDN) to the user.
    window.addEventListener('error', (e) => {
      if (e.message && /import|module|three/i.test(e.message)) {
        document.getElementById('loaderr').classList.remove('hidden');
      }
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
